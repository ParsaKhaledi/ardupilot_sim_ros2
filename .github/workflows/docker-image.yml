name: Docker Image CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "sim-platform"]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: alienkh/ardupilot_sim_gz

jobs:
  docker-build-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute branch tag
        id: vars
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME//\//-}"
          echo "branch_tag=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.branch_tag }}_${{ github.run_number }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:legacy_${{ github.run_number }}
          cache-from: type=gha,scope=ardupilot-sim-ros2
          cache-to: type=gha,mode=max,scope=ardupilot-sim-ros2

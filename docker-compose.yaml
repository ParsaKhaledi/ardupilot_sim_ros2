services:
  sim:
    build:
      context: .
      dockerfile: Dockerfile
    image: ardupilot_sim_ros2:humble-harmonic-4.6.3
    container_name: ardupilot-sim
    hostname: ardupilot-sim
    tty: true
    privileged: true
    network_mode: host
    restart: unless-stopped
    environment:
      DISPLAY: ${DISPLAY}
      XAUTHORITY: ${XAUTH}
      CAMERA_PROFILE: ${CAMERA_PROFILE:-gimbal}
      MODEL_PROFILE: ${MODEL_PROFILE:-iris_with_gimbal}
      WORLD_PROFILE: ${WORLD_PROFILE:-world-default}
      SIM_SPEEDUP: ${SIM_SPEEDUP:-1}
      GZ_HEADLESS: ${GZ_HEADLESS:-false}
      ENABLE_GST_STREAM: ${ENABLE_GST_STREAM:-false}
    volumes:
      - /tmp/.X11-unix/:/tmp/.X11-unix/
      - /dev:/dev/
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
      - ./config:/workspace/config:ro
      - ./scripts:/workspace/scripts:ro
      - ./worlds:/workspace/worlds:ro
      - ./volume:/volume
    command: /workspace/scripts/sim.sh

  mavproxy:
    image: ardupilot_sim_ros2:humble-harmonic-4.6.3
    container_name: ardupilot-mavproxy
    hostname: ardupilot-mavproxy
    tty: true
    privileged: true
    network_mode: host
    restart: unless-stopped
    profiles: ["gcs"]
    environment:
      DISPLAY: ${DISPLAY}
      XAUTHORITY: ${XAUTH}
    volumes:
      - /tmp/.X11-unix/:/tmp/.X11-unix/
      - /dev:/dev/
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
      - ./scripts:/workspace/scripts:ro
      - ./volume:/volume
    command: /workspace/scripts/mavproxy.sh
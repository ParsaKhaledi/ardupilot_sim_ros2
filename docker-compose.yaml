version: '3.6'

services:
  GZ:
    image: "alienkh/ardupilot_sim_gz:legacy_83"
    # image: "alienkh/ardupilot_sim_gz:legacy_82" # if 83 not work try this
    container_name: gz
    hostname: gz
    restart: unless-stopped
    tty: true
    privileged: true
    network_mode: "host"

    environment:
      DISPLAY: ${DISPLAY}
      "XAUTHORITY": ${XAUTH}
    volumes:
      - /tmp/.X11-unix/:/tmp/.X11-unix/
      - /dev:/dev/
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
      # - ./volume/worlds/:/home/ardupilot/ardupilot_gazebo/worlds/
      # - ./volume/models/:/home/ardupilot/ardupilot_gazebo/models/
      - ./volume/worlds/:/home/ardupilot/worlds/
      - ./volume/models/gimbal_small_3d/model.sdf:/home/ardupilot/models/gimbal_small_3d/model.sdf
    command: /bin/bash -c "
      export GZ_SIM_RESOURCE_PATH=/home/ardupilot/ardupilot_gazebo/models:~/ardupilot_gazebo/worlds:$GZ_SIM_RESOURCE_PATH && \
      export GZ_SIM_SYSTEM_PLUGIN_PATH=/home/ardupilot/ardupilot_gazebo/build:$GZ_SIM_SYSTEM_PLUGIN_PATH && \
      cd ~/ardupilot_gazebo && \
      gz sim -v 4 -r -s --headless-rendering ~/ardupilot_gazebo/worlds/iris_runway.sdf  "
      # sleep inf "
      # ENTRYPOINT ["gazebo", "--verbose", "/worlds/iris_arducopter_runway.world"]

  Ardupilot:
    image: "alienkh/ardupilot_sim_gz:legacy_83"
    # image: "alienkh/ardupilot_sim_gz:legacy_82" # if 83 not work try this
    container_name: ardupilot
    hostname: ardupilot
    tty: true
    privileged: true
    network_mode: "host"
    restart: unless-stopped
    environment:
      DISPLAY: ${DISPLAY}
      "XAUTHORITY": ${XAUTH}
    volumes:
      - /tmp/.X11-unix/:/tmp/.X11-unix/
      - /dev:/dev/
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
      - ./volume:/volume/
    command: /bin/bash -c "
      cd ~/ardupilot && \
      ~/ardupilot/build/sitl/bin/arducopter -S \
      --model JSON --speedup 1 \
      --defaults Tools/autotest/default_params/copter.parm,Tools/autotest/default_params/gazebo-iris.parm \
      --sim-address=127.0.0.1 -I0  "

  MAVProxy:
    image: "alienkh/ardupilot_sim_gz:legacy_83"
    # image: "alienkh/ardupilot_sim_gz:legacy_82" # if 83 not work try this
    container_name: MAVProxy
    hostname: MAVProxy
    tty: true
    privileged: true
    network_mode: "host"
    restart: unless-stopped
    environment:
      DISPLAY: ${DISPLAY}
      "XAUTHORITY": ${XAUTH}
    volumes:
      - /tmp/.X11-unix/:/tmp/.X11-unix/
      - /dev:/dev/
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
      - ./volume:/volume/
    command: /bin/bash -c "
      sleep inf"
    # command: /bin/bash -c "
    #   cd ~/ && mavproxy.py --master=tcp:127.0.0.1:5760 --out=udp:127.0.0.1:14550 --map --console "